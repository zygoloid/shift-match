<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13151d">
<title>Shift Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Baloo+2:wght@700;800&family=Audiowide&family=Patrick+Hand&family=Cinzel:wght@700&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="wordmark">Shift<span>Match</span></h1>
    <div class="actions">
      <button id="undo" class="ghost icon" type="button" aria-label="Undo" hidden></button>
      <button id="restart" class="ghost icon" type="button" aria-label="Restart puzzle" hidden></button>
      <button id="hint" class="ghost" type="button">Hint</button>
      <button id="new-game" class="ghost" type="button">New game</button>
    </div>
  </header>

  <nav class="modes" role="tablist" aria-label="Mode">
    <button type="button" role="tab" data-mode="endless">Endless</button>
    <button type="button" role="tab" data-mode="puzzle">Puzzles</button>
  </nav>

  <section class="stats" aria-live="polite">
    <div class="stat">
      <span class="label" id="label-1">Score</span>
      <span class="value-row">
        <button id="prev-puzzle" class="step" type="button" aria-label="Previous puzzle" hidden>‹</button>
        <span id="stat-1" class="value">0</span>
        <button id="next-puzzle" class="step" type="button" aria-label="Next puzzle" hidden>›</button>
      </span>
    </div>
    <div class="stat"><span class="label" id="label-2">Moves</span><span id="stat-2" class="value">0</span></div>
    <div class="stat"><span class="label" id="label-3">Best</span><span id="stat-3" class="value">0</span></div>
  </section>

  <section class="board-wrap" id="board-wrap">
    <div class="frame" id="frame">
      <div class="board" id="board" role="grid" aria-label="Game board"></div>
      <div class="fx" id="fx" aria-hidden="true"></div>
      <div class="toast" id="toast" aria-hidden="true"></div>
      <div class="over" id="over" hidden>
        <p class="over-title" id="over-title">No moves left</p>
        <p class="over-score" id="over-big"></p>
        <p class="over-note" id="over-note"></p>
        <div class="over-actions">
          <button id="over-alt" class="ghost" type="button" hidden>Undo</button>
          <button id="play-again" type="button">Play again</button>
        </div>
      </div>
    </div>
    <div class="track" id="track">
      <div class="cursor" id="cursor" aria-hidden="true"></div>
      <ol class="order" id="order" aria-label="Order in which groups clear"></ol>
    </div>
  </section>

  <footer class="settings">
    <button id="sound" class="ghost icon" type="button" aria-pressed="true" aria-label="Sound on"></button>
    <div class="skins" id="skins" role="radiogroup" aria-label="Theme"></div>
  </footer>
</main>
<script src="logic.js"></script>
<script src="puzzles.js"></script>
<script src="puzzle-pack.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
