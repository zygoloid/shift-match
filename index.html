<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13151d">
<title>Shift Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="wordmark">Shift<span>Match</span></h1>
    <button id="new-game" class="ghost" type="button">New game</button>
  </header>

  <section class="stats" aria-live="polite">
    <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
    <div class="stat"><span class="label">Moves</span><span id="moves" class="value">30</span></div>
    <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
  </section>

  <section class="board-wrap" id="board-wrap">
    <div class="frame" id="frame">
      <div class="board" id="board" role="grid" aria-label="Game board"></div>
      <div class="toast" id="toast" aria-hidden="true"></div>
      <div class="over" id="over" hidden>
        <p class="over-title" id="over-title">Out of moves</p>
        <p class="over-score"><span id="final-score">0</span> points</p>
        <p class="over-note" id="over-note"></p>
        <button id="play-again" type="button">Play again</button>
      </div>
    </div>
  </section>

  <footer class="legend">
    <p class="legend-hint">Tap an arrow to pull its line that way, or a purple tile to turn its neighbors clockwise. A move must line up 3 or more. Groups clear in this order, each one shifting the board its own way:</p>
    <ol class="order" id="order"></ol>
  </footer>
</main>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
